<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - OKAPI Survey Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/logo_small.png') }}">
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <div class="auth-card">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="OKAPI logo" class="auth-logo">
      <h1>OKAPI Environnement Conseil</h1>
      <p class="auth-subtitle">Plateforme d'administration &mdash; Okapi Survey</p>

      {% if error %}
      <div class="auth-error">{{ error }}</div>
      {% endif %}

      <form method="post" class="auth-form">
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>

        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <button type="submit" class="btn maroon auth-submit">Se connecter</button>
      </form>
    </div>
  </div>
</body>
</html>
